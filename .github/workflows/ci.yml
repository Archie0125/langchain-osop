name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest ruff
      - run: ruff check langchain_osop/
      - run: python -c "from langchain_osop.tools import osop_validate; print('import OK')"
