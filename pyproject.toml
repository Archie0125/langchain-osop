[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-osop"
version = "0.1.0"
description = "LangChain integration for OSOP workflows — load, validate, and execute .osop.yaml files as LangChain runnables."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OSOP Contributors", email = "hello@osop.ai" }]
keywords = ["langchain", "osop", "workflow", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "langchain-core>=0.2",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://osop.ai"
Repository = "https://github.com/Archie0125/langchain-osop"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
